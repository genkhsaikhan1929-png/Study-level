}

"Эрх зүй ба хүний эрх":`Хүний эрхийн бүлэгт төрийн үүрэг, хүний эрхийг хамгаалах үндэсний болон олон улсын механизмын талаар авч үздэг. Төр нь хүний эрхийг хүндэтгэх, хамгаалах, хангахтай холбоотой үүрэгтэй.\n\nОлон улсын түвшинд НҮБ-ын дүрэмд үндэслэсэн байгууллагууд болон хүний эрхийн гэрээнд үндэслэсэн байгууллагуудын тогтолцоог сурах бичигт тайлбарласан. Үүнд НҮБ-ын Ерөнхий Ассамблей, Аюулгүйн зөвлөл, Эдийн засаг, нийгмийн зөвлөл, Хүний эрхийн комисс зэрэг байгууллагууд дурдагддаг.\n\nХүний эрхийн ойлголтыг цээжлэхдээ эрхийн нэрийг дангаар нь бус, тухайн эрхийг хэн хамгаалах, ямар механизм хэрэгждэгийг хамтад нь ойлгох нь чухал.`,

    "Механик":"Энэ сэдвээр хөдөлгөөнийг тоон хэмжигдэхүүнээр тайлбарлаж, хүч хөдөлгөөнд хэрхэн нөлөөлдгийг ойлгоно. Хөдөлгөөний тоо хэмжээ нь биетийн масс ба хурдтай холбоотой. Хүчний үйлчлэлийг хугацаатай нь хамтатган авч үзэхэд хүчний импульс гарна. Мөн ажил, энерги, чадлын ойлголтуудыг ашиглан хөдөлгөөний явцыг тайлбарлаж, энергийн хувирал ба хадгалагдах чанарыг хэрэглэнэ. Шингэний механикт даралт, хөвөх үзэгдэл болон шингэний урсгалыг авч үздэг.",
    "Шингэний механик":"Шингэн дотор даралт бүх чиглэлд дамждаг бөгөөд шингэний даралт нь гүнээс хамаарч өөрчлөгдөнө. Хөвж байгаа биед үйлчлэх Архимедийн хүчийг хүндийн хүчтэй харьцуулж биетийн хөвөх нөхцөлийг тайлбарлана. Харилцах сав, шингэнт шахуурга зэрэг нь даралт дамжих зарчимтай холбоотой. Мөн урсаж буй шингэний хурд, даралт болон огтлолын өөрчлөлтийн хоорондын хамаарлыг авч үзнэ.",
    "Молекул физик":"Бодис маш олон жижиг бөөмсөөс тогтоно гэсэн молекул кинетик үзлийг ашиглан температур, даралт, эзлэхүүн зэрэг макро хэмжигдэхүүнийг тайлбарлана. Идеал хийн загварт бөөмсийн мөргөлдөөн, дулааны хөдөлгөөн чухал. Температур нэмэгдэхэд молекулуудын дундаж кинетик энерги нэмэгдэнэ. Хийн төлөвийн өөрчлөлтийг туршилтын хуулиуд болон Менделеев–Клапейроны тэгшитгэлээр илэрхийлж болно.",
    "Термодинамик":"Дотоод энерги нь бодисын дотоод бүтэцтэй холбоотой энергийн нийлбэр юм. Термодинамикийн процессын үед систем дулаан авч, ажил хийж болох бөгөөд үүний үр дүнд дотоод энерги өөрчлөгдөнө. Энергийн өөрчлөлтийг эхний ба эцсийн төлөвөөр харьцуулж судалдаг. Дулааны хөдөлгүүрийн ажиллах зарчимд дулааны энергийг механик ажил болгон хувиргах үйл явц хамаарна.",
    "Цахилгаан орон":"Цэнэгүүдийн эргэн тойронд цахилгаан орон үүсдэг бөгөөд орныг хүчний шугамаар дүрслэж болно. Цахилгаан орны хүчлэг нь тухайн орон цэнэгт биед ямар хүчээр үйлчилж байгааг тодорхойлоход хэрэглэгдэнэ. Потенциал ба потенциалын ялгавар нь цахилгаан орны энергийн шинжийг тооцоход ашиглагдана. Жигд цахилгаан орон болон цэнэгт бөөмийн хөдөлгөөнийг томьёо, зураглалтай нь хамтатган судална.",
    "Соронзон орон ба цахилгаан хэлхээ":"Гүйдэлтэй дамжуулагчийн орчимд соронзон орон үүсдэг бөгөөд соронзон орныг индукцийн шугамаар дүрслэнэ. Цахилгаан хэлхээнд гүйдэл, хүчдэл, эсэргүүцэл, тэжээлийн үүсгүүрийн ЦХХ болон дотоод эсэргүүцлийг хооронд нь холбон тооцно. Хэлхээний хэсгүүдийн потенциалын ялгаврыг зөв тэмдэглэж, гүйдлийн чиглэлтэй уялдуулан бодох нь чухал.",
    "Механик хэлбэлзэл ба долгион":"Хэлбэлзэх хөдөлгөөнд далайц, үе, давтамж, өнцөг давтамж зэрэг хэмжигдэхүүн хэрэглэнэ. Чөлөөт, унтрах болон албадмал хэлбэлзлийг ялгаж, гадны давтамж системийн өөрийн давтамжтай ойртох үед резонанс үүсэхийг судална. Механик долгион нь орчинд тархах бөгөөд дуу нь механик долгионы нэг хэлбэр юм. Чавхдасны зогсонги долгионд зангилаа, багцрал үүсэж болно.",
    "Нийгмийн тэгш бус байдал ба давхраажилт":"Нийгмийн давхраажилтыг хүмүүсийн нөөц, боломж, байр суурь болон нийгмийн үнэлгээний ялгаатай холбоно. Нийгмийн ялгааг зөвхөн нэг хүчин зүйлээр бус, бүтэц, соёл, боломж, хандлага зэрэг олон талаас авч үзнэ. Алагчлалын хэлбэрүүдийг ялгаж ойлгох нь нийгмийн тэгш байдлыг судлахад чухал.",
    "Нийгмийн өөрчлөлт":"Нийгэм цаг хугацааны явцад өөрчлөгдөж байдаг бөгөөд өөрчлөлтөд дотоод болон гадаад хүчин зүйлс нөлөөлж болно. Номд уламжлалт, орчин үеийн, орчин үеийн дараах нийгмийн шинжүүдийг харьцуулан авч үздэг. Нийгмийн өөрчлөлтийг тайлбарлахад функционализм, зөрчилдөөний хандлага зэрэг онолын тайлбарууд хэрэглэгдэнэ.",
    "Соёл":"Соёл нь хэл, ёс заншил, мэдлэг, боловсрол, шашин шүтлэг зэрэг олон бүрэлдэхүүнтэй. Соёлын үйлдвэрлэл нь соёлын бүтээгдэхүүн, үйлчилгээтэй холбоотой бол соёлын даяаршил нь өөр өөр соёлын харилцан нөлөөллийг хамарна. Соёлын адилсал, дархлаа, эрх чөлөө, соёлын солилцоо зэрэг ойлголтыг хооронд нь ялгаж ойлгох хэрэгтэй.",
    "Эрх зүй ба хүний эрх":"Хүний эрх нь хүний нэр төр, алдар хүндтэй холбоотой төрөлх эрх бөгөөд хүн бүр эрхээ тэгш эдлэх зарчимд тулгуурлана. Төр хүний эрх, эрх чөлөөг хүндэтгэх, хамгаалах, хангах үүрэгтэй. Хүүхдийн эрх, хүүхэд хамгааллын асуудал болон хүний эрхийг хамгаалах үндэсний, олон улсын механизмын талаар судална.",
    "Олон улсын харилцаа":"Олон улсын харилцааг хөрш орнуудын, бүс нутгийн болон глобал түвшинд авч үзэж болно. Олон улсын байгууллагууд тодорхой нийтлэг зорилгын хүрээнд хамтын ажиллагааг зохион байгуулдаг. Монгол Улсын гадаад бодлогод хоёр хөршийн харилцаанаас гадна гуравдагч хөршийн бодлого чухал байр суурьтай. Энэ хүрээнд улс төр, эдийн засаг, соёл, хүмүүнлэгийн салбарын хамтын ажиллагааг авч үздэг."
  };
  return (t.theory || "") + " " + (socialTheory[t.name] || extra[t.name] || "");
}
function theory(i){
topic=data[subject].topics[i];
app.innerHTML=`<button class="back" onclick="subjects('${subject}')">← Буцах</button>
<div class="card theory"><span class="badge">${subject}</span><h2>${topic.name}</h2><p>${longTheory(topic)}</p>
${formulaDetails[topic.name]?`<h3>📐 Томьёо ба нэгжийн тайлбар</h3>${formulaDetails[topic.name].map(x=>`<div class="formula"><b>${x[0]}</b><br><span style="font-family:Arial">${x[1]}<br><b>Тэмдэглэгээ:</b> ${x[2]}<br><b>Нэгж:</b> ${x[3]}<br>${x[4]}</span></div>`).join("")}`:(topic.formula?`<h3>📌 Гол зүйл</h3>${topic.formula.map(x=>`<div class="formula">${x}</div>`).join("")}`:"")}
</div><button class="btn" onclick="startTopic(${i})">📝 Энэ сэдвээр тест өгөх</button>`;
}
function makeVariant(q,topic){
 let arr=q[1].map((x,i)=>({x,i})).sort(()=>Math.random()-.5);
 return {q:q[0],a:arr.map(z=>z.x),c:arr.findIndex(z=>z.i===q[2]),topic};
}
function buildPool(t){
  let pool=[];
  t.qs.forEach(q=>pool.push({q:q[0],a:q[1],c:q[2],topic:t.name}));
  t.qs.forEach(q=>pool.push(makeVariant(q,t.name)));
  return pool;
}
function takeQuestions(pool,n){
  let out=[];
  while(out.length<n){
    let shuffled=pool.slice().sort(()=>Math.random()-.5);
    for(let q of shuffled){
      if(out.length>=n) break;
      out.push({...q});
    }
  }
  return out.sort(()=>Math.random()-.5);
}
function startTopic(i){
 let t=data[subject].topics[i];
 quiz=takeQuestions(buildPool(t),15);
 runQuiz();
}
function startSubject(){
 let pool=[];
 data[subject].topics.forEach(t=>pool=pool.concat(buildPool(t)));
 quiz=takeQuestions(pool,25);
 runQuiz();
}
function practice(){
if(!weak.length){subjects(subject);return}
quiz=[];data[subject].topics.forEach(t=>{if(weak.includes(t.name))t.qs.forEach(q=>quiz.push({q:q[0],a:q[1],c:q[2],topic:t.name}))});
quiz.sort(()=>Math.random()-.5);runQuiz();
}
function runQuiz(){mode="quiz";qi=0;score=0;mistakes=[];renderQ();}
function renderQ(){
let q=quiz[qi], pct=Math.round(qi/quiz.length*100);
app.innerHTML=`<div class="card"><span class="badge">${subject}</span><p class="muted">Асуулт ${qi+1} / ${quiz.length} • ${q.topic}</p><div class="progress"><div class="bar" style="width:${pct}%"></div></div><h2>${q.q}</h2>
${q.a.map((a,i)=>`<button class="answer" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${a}</button>`).join("")}</div>`;
}
function answer(i){
let q=quiz[qi]; if(i===q.c)score++;else mistakes.push({q,chosen:i});
qi++; if(qi<quiz.length)renderQ();else result();
}
function result(){
let pct=Math.round(score/quiz.length*100);
weak=[...new Set(mistakes.map(m=>m.q.topic))];
history.push({subject,score,pct,total:quiz.length,date:new Date().toLocaleString(),weak});
if(history.length>30)history.shift();save();
app.innerHTML=`<div class="card center"><h2>📊 Үр дүн</h2><div class="score">${pct}%</div><p>${score} / ${quiz.length} зөв</p><span class="badge">${pct>=80?"Ахисан":pct>=60?"Дунд":pct>=40?"Суурь":"Эхлэгч"} түвшин</span></div>
<div class="card"><h3>🎯 Сул сэдэв</h3>${weak.length?weak.map(x=>`<div class="topic">${x}</div>`).join(""):"<p>Алдсан сэдэв алга.</p>"}</div>
<div class="card"><h3>❌ Алдсан асуултууд</h3>${mistakes.length?mistakes.map(m=>`<div class="topic error"><b>${m.q.topic}</b><br>${m.q.q}<br><span class="muted">Таны хариулт: ${m.q.a[m.chosen]}<br>Зөв хариулт: ${m.q.a[m.q.c]}</span></div>`).join(""):"<div class='topic ok'>Бүх асуултыг зөв хариуллаа 🎉</div>"}</div>
${weak.length?`<button class="btn" onclick="practice()">💪 Сул сэдвээ давтах</button>`:""}<button class="light" onclick="aiTutorFromResult()">🤖 AI-аар үр дүнгээ тайлбарлуулах</button>
<button class="light" onclick="subjects('${subject}')">📚 Сэдвүүд рүү</button><button class="light" onclick="home()">🏠 Нүүр</button>`;
}

let aiMessages = JSON.parse(localStorage.getItem("study_ai_messages")||"[]");

function aiContext(){
  const subjectName = subject || "Ерөнхий";
  const topics = data[subjectName] ? data[subjectName].topics.map(t=>t.name).join(", ") : "";
  const weakText = weak && weak.length ? weak.join(", ") : "одоогоор тодорхой сул сэдэв алга";
  const last = history.filter(h=>h.subject===subjectName).slice(-3).map(h=>`${h.pct}% (${h.weak.join(", ")||"сул сэдэвгүй"})`).join(" | ");
  return `Чи Study Level AI нэртэй Монгол хэлний сурагчийн AI багш.
Хичээл: ${subjectName}.
Сэдвүүд: ${topics}.
Одоогийн сул сэдэв: ${weakText}.
Сүүлийн тестийн үзүүлэлт: ${last||"тестийн түүх байхгүй"}.
Сурагчид 9-11-р ангийн түвшинд ойлгомжтой, энгийн Монгол хэлээр тайлбарла. Нийгэм судлалд эрдэмтэн, онолын нэрийг тодорхой хэлж, тухайн эрдэмтний санааг тайлбарла. Физикт томьёо бүрийн хэмжигдэхүүний нэр, тэмдэглэгээ, SI нэгжийг хэл.
Томьёо байвал тэмдэглэгээ, хэмжигдэхүүний нэр, нэгж, хэрэглээг тайлбарла.
Хариуг ойлгуулахад чиглүүл.`;
}

function escapeAI(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function escapeAttr(s){return String(s??"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function aiTutor(prefill=""){
  app.innerHTML=`<button class="back" onclick="home()">← Буцах</button>
  <div class="card"><span class="aiTag">🤖 Study Level AI</span><h2>AI багш</h2>
  <p>AI багшийг олон хүүхдэд аюулгүй ашиглахын тулд серверийн хамгаалалттай холболт шаардлагатай.</p>
  <div class="note">Одоогийн GitHub Pages хувилбарт API түлхүүр хадгалахгүй. Тиймээс эндээс API түлхүүр бүү оруулаарай. AI холболтыг дараагийн хувилбарт хамгаалалттай backend-ээр холбоно.</div>
  </div>
  <div class="card"><h3>📚 Одоогоор ашиглах боломжтой</h3>
  <button class="light" onclick="subjects(subject)">Сэдвүүд үзэх</button>
  <button class="light" onclick="subjectTest(subject)">Тест өгөх</button>
  <button class="light" onclick="progress()">Ахиц харах</button></div>`;
}
function aiTutorFromResult(){
  aiTutor();
}

function progress(){
let by={};history.forEach(h=>{by[h.subject]??=[];by[h.subject].push(h.pct)});
app.innerHTML=`<button class="back" onclick="home()">← Буцах</button><div class="card"><h2>📈 Миний ахиц</h2>${Object.entries(by).map(([s,a])=>`<div class="stat"><b>${s}</b><span>${a[a.length-1]}% • ${a.length} тест</span></div>`).join("")||"<p class='muted'>Тест өгсний дараа ахиц энд гарна.</p>"}</div>
${history.slice().reverse().slice(0,10).map(h=>`<div class="card"><b>${h.subject}</b><p class="muted">${h.date}</p><div class="stat"><span>Оноо</span><b>${h.pct}%</b></div><div class="stat"><span>Сул сэдэв</span><b>${h.weak.length?h.weak.join(", "):"байхгүй"}</b></div></div>`).join("")}`;
}

let currentUser = JSON.parse(localStorage.getItem("study_current_user") || "null");
function authScreen(tab="register"){
 document.querySelector(".top").style.display="none";
 app.innerHTML=`<div class="authWrap"><div class="card center">
 <div style="font-size:48px">📚</div><h2>Study Level</h2>
 <p class="muted">Тест, онол, алдаа ба ахиц нэг дор.</p>
 <div class="tabs">
  <button class="${tab==="login"?"active":""}" onclick="authScreen('login')">Нэвтрэх</button>
  <button class="${tab==="register"?"active":""}" onclick="authScreen('register')">Бүртгүүлэх</button>
 </div>
 ${tab==="register"?`
  <div class="label">Хэрэглэгчийн нэр</div><input id="regName" placeholder="Жишээ: Enkhee">
  <div class="label">Нууц үг</div><input id="regPass" type="password" placeholder="Нууц үг">
  <div class="label">Нууц үгээ давтах</div><input id="regPass2" type="password" placeholder="Дахин оруулах">
  <button class="primary" onclick="registerUser()">Бүртгэл үүсгэх</button>
 `:`
  <div class="label">Хэрэглэгчийн нэр</div><input id="logName" placeholder="Хэрэглэгчийн нэр">
  <div class="label">Нууц үг</div><input id="logPass" type="password" placeholder="Нууц үг">
  <button class="primary" onclick="loginUser()">Нэвтрэх</button>
 `}
 <div class="note">Энэ нь одоогоор demo бүртгэл бөгөөд мэдээллийг зөвхөн энэ төхөөрөмжийн browser-д хадгална.</div>
 </div></div>`;
}
function registerUser(){
 let n=document.getElementById("regName").value.trim();
 let p=document.getElementById("regPass").value;
 let p2=document.getElementById("regPass2").value;
 if(!n||!p){alert("Хэрэглэгчийн нэр, нууц үгээ оруулна уу.");return;}
 if(p!==p2){alert("Нууц үг таарахгүй байна.");return;}
 let users=JSON.parse(localStorage.getItem("study_users")||"{}");
 if(users[n]){alert("Энэ хэрэглэгчийн нэр бүртгэлтэй байна.");return;}
 users[n]={name:n,pass:p}; localStorage.setItem("study_users",JSON.stringify(users));
 currentUser=users[n]; localStorage.setItem("study_current_user",JSON.stringify(currentUser));
 document.querySelector(".top").style.display="block"; renderHomeWithUser();
}
function loginUser(){
 let n=document.getElementById("logName").value.trim(),p=document.getElementById("logPass").value;
 let users=JSON.parse(localStorage.getItem("study_users")||"{}");
 if(!users[n]||users[n].pass!==p){alert("Хэрэглэгчийн нэр эсвэл нууц үг буруу.");return;}
 currentUser=users[n];localStorage.setItem("study_current_user",JSON.stringify(currentUser));
 document.querySelector(".top").style.display="block";renderHomeWithUser();
}
function logoutUser(){
 localStorage.removeItem("study_current_user");currentUser=null;authScreen("login");
}
function renderHomeWithUser(){home();}

if(currentUser){document.querySelector(".top").style.display="block";home();}else{authScreen("register");}
</script>
